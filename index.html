<body>
    <div class="checkout-wrapper">
        <div class="controls-container">
            <h2>Secure Checkout</h2>
            <div class="section">
                 <label>Amount (MYR)</label>
                 <input type="number" id="display_amt" step="0.01">
            </div>
            <div class="section">
                 <label>Payment Method</label>
                 <select id="method_selector" onchange="loadPaymentForm(this.value)">
                    <option value="">-- Select --</option>
                    <option value="VisaMaster">Card</option>
                    <option value="fpx">FPX</option>
                    <option value="ewallets">E-Wallet</option>
                    <option value="duitnowqr">DuitNow QR</option>
                 </select>
            </div>
            <hr>
            <div id="dynamic-form-container"></div>
            <button onclick="processPayment()" id="pay-btn">Pay Now</button>
        </div>
    </div>
</body>
